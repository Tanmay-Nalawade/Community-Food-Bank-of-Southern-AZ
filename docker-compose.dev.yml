# Local development on top of docker-compose.yml: mounts your code and runs
# nodemon so edits restart the server. Not loaded automatically — add
#   COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
# to your local .env, or pass both files with -f. A plain `docker compose up`
# (as on the production server) uses docker-compose.yml alone.
services:
  app:
    build:
      args:
        INSTALL_DEV: "true"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm run db:migrate && npm run dev"
    environment:
      NODE_ENV: development
